<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deteksi Penyakit Kuku AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white text-center">
                        <h4 class="mb-0">AI Klasifikasi Penyakit Kuku</h4>
                    </div>
                    <div class="card-body">
                        <form id="uploadForm">
                            <div class="mb-3">
                                <label for="imageUpload" class="form-label">Unggah Foto Kuku</label>
                                <input class="form-control" type="file" id="imageUpload" accept="image/*" required>
                            </div>

                            <div class="text-center mb-3">
                                <img id="imagePreview" src="#" alt="Preview" class="img-fluid rounded d-none"
                                    style="max-height: 300px; object-fit: contain;">
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success" id="submitBtn">Deteksi Penyakit</button>
                            </div>
                        </form>

                        <div id="resultCard" class="alert alert-info mt-4 d-none text-center" role="alert">
                            <h5 class="alert-heading">Hasil Prediksi:</h5>
                            <h3 id="resultClass" class="fw-bold text-uppercase"></h3>
                            <p class="mb-0">Tingkat Akurasi: <span id="resultConfidence" class="fw-bold"></span>%</p>
                        </div>

                        <div id="errorCard" class="alert alert-danger mt-4 d-none text-center" role="alert">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');

        // Menampilkan Preview Gambar saat dipilih
        imageUpload.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    imagePreview.src = e.target.result;
                    imagePreview.classList.remove('d-none');
                }
                reader.readAsDataURL(file);
            }
        });

        // Menangani form submit via AJAX
        uploadForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const file = imageUpload.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            // Reset UI state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Memproses...';
            document.getElementById('resultCard').classList.add('d-none');
            document.getElementById('errorCard').classList.add('d-none');

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                } else {
                    document.getElementById('resultClass').textContent = data.class;
                    document.getElementById('resultConfidence').textContent = data.confidence.toFixed(2);
                    document.getElementById('resultCard').classList.remove('d-none');
                    document.getElementById('resultCard').classList.remove('alert-info');

                    // Ubah warna indikator berdasarkan tingkat kepercayaan
                    if (data.confidence > 80) {
                        document.getElementById('resultCard').classList.add('alert-success');
                    } else {
                        document.getElementById('resultCard').classList.add('alert-warning');
                    }
                }
            } catch (error) {
                showError('Terjadi kesalahan saat menghubungi server.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Deteksi Penyakit';
            }
        });

        function showError(message) {
            const errorCard = document.getElementById('errorCard');
            errorCard.textContent = message;
            errorCard.classList.remove('d-none');
        }
    </script>
</body>

</html>
